name: Auth Service CI Pipeline

on:
  pull_request:
    branches: [ develop, dev, main, master ]
  workflow_dispatch:

concurrency:
  group: ci-auth-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Compilação, Linter & Testes Unitários (Go)
  # Executado em todos os Pull Requests e disparos manuais
  quality:
    name: Code Quality & Unit Tests
    uses: oseiasal/.github/.github/workflows/reusable-go-quality.yml@main
    with:
      go-version: '1.22'

  # 2. Segurança DevSecOps (SAST Gosec & SCA Trivy)
  # Executado em PRs para main/master e disparos manuais
  security:
    name: DevSecOps Security Analysis
    needs: quality
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.base_ref == 'main' ||
      github.base_ref == 'master'
    uses: oseiasal/.github/.github/workflows/reusable-security.yml@main
    with:
      language: 'go'
      go-version: '1.22'
      trivy-severity: 'CRITICAL,HIGH'
      fail-on-critical: true
