name: Auth Service CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

concurrency:
  group: auth-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Compilação, Linter & Testes Unitários (Go)
  quality:
    name: Code Quality & Unit Tests
    uses: oseiasal/.github/.github/workflows/reusable-go-quality.yml@main
    with:
      go-version: '1.22'

  # 2. Varredura de Segurança (SAST Gosec & SCA Trivy com bloqueio em CRITICAL)
  security:
    name: DevSecOps Security Analysis
    needs: quality
    uses: oseiasal/.github/.github/workflows/reusable-security.yml@main
    with:
      language: 'go'
      go-version: '1.22'
      trivy-severity: 'CRITICAL,HIGH'
      fail-on-critical: true

  # 3. Build do Container Docker
  build:
    name: Docker Container Build
    needs: security
    uses: oseiasal/.github/.github/workflows/reusable-build.yml@main
    with:
      dockerfile-path: 'Dockerfile.auth'
      image-name: 'auth-service'
      push-image: false
