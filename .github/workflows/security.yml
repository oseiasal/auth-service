name: DevSecOps Security Scan

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  schedule:
    - cron: '0 4 * * 1' # Executa semanalmente toda segunda-feira às 04:00 UTC

concurrency:
  group: security-scan-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: DevSecOps Security Analysis (SAST Gosec & SCA Trivy)
    uses: oseiasal/.github/.github/workflows/reusable-security.yml@main
    with:
      language: 'go'
      go-version: '1.22'
      trivy-severity: 'CRITICAL,HIGH'
      fail-on-critical: true
